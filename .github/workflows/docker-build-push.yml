name: Build and Push Web Image

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/docker-build-push.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clo835-project-service-discovery-web:v2
            ${{ secrets.DOCKERHUB_USERNAME }}/clo835-project-service-discovery-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clo835-project-service-discovery-web:${{ github.sha }}
