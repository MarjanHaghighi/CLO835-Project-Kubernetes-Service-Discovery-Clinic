apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-127878254
  namespace: clinic-127878254
  labels:
    app: db
    owner: "127878254"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: db
      owner: "127878254"

  template:
    metadata:
      labels:
        app: db
        owner: "127878254"

    spec:
      containers:
        - name: mysql
          image: mysql:8
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config-127878254
                  key: DB_NAME

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config-127878254
                  key: DB_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret-127878254
                  key: DB_PASSWORD

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret-127878254
                  key: MYSQL_ROOT_PASSWORD

          volumeMounts:
            - name: seed-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p""
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p""
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: seed-sql
          configMap:
            name: db-seed-127878254
