apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-127878254
  namespace: clinic-127878254
  labels:
    app: web
    owner: "127878254"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web
      owner: "127878254"

  template:
    metadata:
      labels:
        app: web
        owner: "127878254"

    spec:
      containers:
        - name: web
          image: marjanhaghighi/clo835-project-service-discovery-web:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: app-config-127878254

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret-127878254
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
